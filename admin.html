<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المعلم</title>
<style>body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:#fbf5e6;color:#1f1a17;line-height:1.7}header{background:#8a1538;color:#fff;text-align:center;padding:14px;border-bottom:5px double #b8892b}main{max-width:980px;margin:auto;padding:14px}
.c{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.k{background:#fff;border:2px solid #b8892b;border-radius:12px;padding:10px;text-align:center}.k b{display:block;font-size:1.8rem;color:#8a1538}
table{width:100%;border-collapse:collapse;background:#fff;margin:10px 0}th,td{border:1px solid #e6d8b5;padding:6px;text-align:center}th{background:#f4e2b0}input,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #b8892b}button{background:#b8892b;color:#fff;cursor:pointer}.w{overflow-x:auto}</style></head><body>
<header><h2 style="margin:0">لوحة المعلم – مراجعة التربية الإسلامية</h2></header><main id="m"><p>كلمة سر المعلم:</p><input id="pw" type="password"> <button onclick="load()">دخول</button><div id="o"></div></main>
<script>
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const pw=document.getElementById('pw').value,o=document.getElementById('o');
 const r=await fetch('/api/stats',{headers:{'x-key':pw}});if(!r.ok){o.innerHTML='<p style="color:#b3261e">كلمة السر غير صحيحة أو لم تُضبط في Netlify.</p>';return}
 const s=await r.json(),D=await (await fetch('questions.json')).json(),pct=(c,t)=>t?Math.round(c*100/t)+'%':'—';
 const k=(t,v)=>`<div class="k">${t}<b>${v}</b></div>`,d=t=>t?new Date(t).toLocaleString('ar-EG'):'—';
 o.innerHTML=`<div class="c">${k('الطلبة المشتركون',s.students.length)}${k('زاروا اليوم',s.today)}${k('إجمالي الزيارات',s.visits)}${k('أسئلة أُجيبت',s.A)}${k('إجابات صحيحة',s.C)}${k('إجابات خاطئة',s.W)}${k('نسبة الصحة',pct(s.C,s.A))}</div>
 <h3>حسب القسم</h3><div class="w"><table><tr><th>القسم</th><th>إجابات</th><th>صحيحة</th><th>خاطئة</th><th>النسبة</th></tr>${D.map((x,i)=>{const z=s.sec[i]||{c:0,w:0};return`<tr><td>${x.ic} ${E(x.t)}</td><td>${z.c+z.w}</td><td>${z.c}</td><td>${z.w}</td><td>${pct(z.c,z.c+z.w)}</td></tr>`}).join('')}</table></div>
 <h3>الطلبة</h3><div class="w"><table><tr><th>الاسم</th><th>آخر دخول</th><th>أيام الزيارة</th><th>أسئلة</th><th>صحيحة</th><th>خاطئة</th><th>النسبة</th></tr>${s.students.map(t=>`<tr><td>${E(t.name)}</td><td>${d(t.last)}</td><td>${t.days}</td><td>${t.c+t.w}</td><td>${t.c}</td><td>${t.w}</td><td>${pct(t.c,t.c+t.w)}</td></tr>`).join('')}</table></div>
 <h3>أكثر الأسئلة خطأً</h3><div class="w"><table><tr><th>السؤال</th><th>خاطئة</th><th>صحيحة</th></tr>${s.hard.map(h=>{const[a,b]=h.q.split('.');const q=D[a]&&D[a].q[b];return`<tr><td style="text-align:right">${E(q?q.q:h.q)}</td><td>${h.w}</td><td>${h.c}</td></tr>`}).join('')}</table></div>`}
</script></body></html>
